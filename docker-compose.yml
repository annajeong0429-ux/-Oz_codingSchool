services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    # 로컬 개발용 --reload (코드 수정 즉시 반영)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app          # ① 프로젝트 전체를 /app에 마운트 → 코드 수정 즉시 반영
      - /app/.venv      # ② 컨테이너 .venv 보호 (호스트 macOS venv로 안 덮이게)
      - media_volume:/app/media # ⭐ 업로드된 X-ray를 볼륨에 영구저장
    env_file:
      - .env            # DB_USER/PASSWORD/NAME/PORT 주입
    environment:
      - DB_HOST=mysql   # ④ 컨테이너에선 'mysql' 서비스명으로 DB 접속
      - REDIS_URL=redis://redis:6379/0   # 작업 큐 + 결과 Pub/Sub
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ② slim엔 curl이 없어서 python 표준 라이브러리로 체크
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}   # ③ 앱이 root로 접속 → root 비번 = DB_PASSWORD
      MYSQL_DATABASE: ${DB_NAME}            # 시작 시 이 DB 자동 생성
    volumes:
      - mysql_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"           # 호스트에서 확인용 (선택)
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-worker:                              # 소비자(Consumer) — 정인님 worker/Dockerfile
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - .:/app
      - /app/.venv
      - media_volume:/app/media           # api가 저장한 X-ray를 worker가 읽음
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1        # ← print 출력 즉시 flush (워커 로그 보이게)
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_volume:
  media_volume:
  redis_volume:


